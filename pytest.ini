[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# sys-level capture: with the default fd-level capture, Tcl cannot read its
# init.tcl under the Microsoft Store Python ("couldn't read file ... No
# error"), and every test that opens a Tk window skipped itself silently.
addopts = --capture=sys
